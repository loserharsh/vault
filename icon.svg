<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A20" />
      <stop offset="100%" stop-color="#0E0F12" />
    </linearGradient>
    <pattern id="hatch-icon" width="24" height="24" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="24" stroke="rgba(255,255,255,0.25)" stroke-width="6" />
    </pattern>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Hatched accent layer -->
  <rect x="64" y="64" width="384" height="384" rx="96" fill="url(#hatch-icon)" />

  <!-- Vibrant Coral geometric S/pill mark -->
  <rect x="120" y="140" width="130" height="232" rx="65" fill="#F04E23" />
  <rect x="262" y="140" width="130" height="232" rx="65" fill="#9DCAFF" />
  <circle cx="256" cy="256" r="38" fill="#121316" />
</svg>
